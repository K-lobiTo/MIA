# Configuración de Alembic para usarlo desde la terminal (alembic upgrade head, alembic revision ...).
# La API no lo necesita: mia.storage.db.init_db arma su propia configuración al arrancar.
[alembic]
script_location = src/mia/storage/migrations
# La URL sale de DATABASE_URL (ver env.py), no de este archivo.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
