# Variables de entorno del servicio en Cloud Run. Copiar a .env.cloudrun.yaml en la raíz del
# repositorio (ignorado por git) y completar las credenciales. Ver docs/OPERACION.md.
DATABASE_URL: "postgresql://usuario:clave@host.neon.tech/mia?sslmode=require"
QDRANT_URL: "https://<cluster>.cloud.qdrant.io"
QDRANT_API_KEY: ""
QDRANT_COLLECTION: "mia_chunks"
EMBEDDING_PROVIDER: "local"
LLM_PROVIDER: "glm"
GLM_API_KEY: ""
GLM_THINKING: "true"
# Calibrado con actas reales, ver specs/001-pipeline-ingesta-rag/research.md
QUERY_SIMILARITY_THRESHOLD: "0.82"
QUERY_SEARCH_LIMIT: "8"
QUERY_CONTEXT_NEIGHBORS: "1"
QUERY_FULL_DOCUMENT_MAX_CHUNKS: "12"
# Con 1 GiB la ingesta cabe en el servidor; se hace dentro de la petición por el cobro por petición.
INGESTION_ENABLED: "true"
INGESTION_SYNC: "true"
