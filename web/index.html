<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MIA: Memoria Institucional Académica</title>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <h1>MIA</h1>
        <p class="subtitle">Memoria Institucional Académica</p>
        <h2>Dominios</h2>
        <div id="domains" class="domains">
          <p class="muted">Cargando dominios...</p>
        </div>
        <p class="hint">Las respuestas se basan solo en los documentos de los dominios elegidos.</p>
      </aside>

      <main class="chat">
        <div id="messages" class="messages">
          <div class="empty" id="empty">
            <p>Elige uno o varios dominios y escribe tu pregunta.</p>
            <p class="muted">Por ejemplo: "¿Cómo se evalúa el curso Análisis y Diseño de Algoritmos?"</p>
          </div>
        </div>
        <form id="form" class="composer">
          <textarea
            id="question"
            rows="1"
            placeholder="Escribe tu pregunta..."
            autocomplete="off"
          ></textarea>
          <button id="send" type="submit" disabled>Enviar</button>
        </form>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
