<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Chat de ejemplo</title>
<style>
  /* Conversación simulada para el video D1: no es la pantalla de WhatsApp, solo muestra los mensajes reales del bot. */
  :root { --ink:#1c2f45; --soft:#4b6178; --line:#c9dde6; --blue:#3d5a80; --ice:#e3f0f5; --pop:#ee6c4d; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; background:#f2f8fa; color:var(--ink); font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
         display:grid; grid-template-columns: 1fr 460px 1fr; align-items:center; }
  .lado { padding:0 28px; color:var(--soft); font-size:15px; }
  .lado.izq { text-align:right; }
  .lado strong { color:var(--ink); }
  .telefono { grid-column:2; height:680px; background:#fff; border:1px solid var(--line); border-radius:22px; overflow:hidden;
              display:flex; flex-direction:column; box-shadow:0 8px 30px rgba(28,47,69,.12); }
  header { background:var(--blue); color:#fff; padding:12px 16px; display:flex; gap:12px; align-items:center; }
  .avatar { width:40px; height:40px; border-radius:50%; background:#98c1d9; color:var(--ink); display:grid; place-items:center; font-weight:700; }
  header b { display:block; line-height:1.2; }
  header small { opacity:.85; }
  #mensajes { flex:1; overflow-y:auto; padding:14px 12px; background:#eef5f8; display:flex; flex-direction:column; gap:8px; scroll-behavior:smooth; }
  .b { max-width:82%; padding:8px 11px 6px; border-radius:12px; white-space:pre-wrap; word-wrap:break-word; font-size:15px; }
  .b .hora { display:block; text-align:right; font-size:11px; opacity:.6; margin-top:2px; }
  .bot { align-self:flex-start; background:#fff; border:1px solid var(--line); border-top-left-radius:3px; }
  .yo { align-self:flex-end; background:var(--blue); color:#fff; border-top-right-radius:3px; }
  .b img { display:block; width:100%; border-radius:8px; margin-bottom:6px; }
  .nota { align-self:center; font-size:12px; color:var(--soft); background:#fff; border:1px solid var(--line); border-radius:12px; padding:3px 12px; }
  .escribiendo { align-self:flex-start; background:#fff; border:1px solid var(--line); border-radius:12px; padding:8px 14px; color:var(--soft); font-size:14px; }
  .escribiendo[hidden] { display:none; }
  .caja { display:flex; gap:8px; padding:10px; border-top:1px solid var(--line); background:#fff; }
  .caja input { flex:1; font:inherit; padding:9px 14px; border:1px solid var(--line); border-radius:20px; outline:none; color:var(--ink); }
  .caja input:focus { border-color:var(--blue); }
  .caja button { font:inherit; border:0; border-radius:20px; padding:0 16px; cursor:pointer; background:var(--blue); color:#fff; }
  .caja button.audio { background:var(--ice); color:var(--ink); }
</style>
</head>
<body>
  <div class="lado izq"><strong>Conversación simulada</strong><br>Muestra los mensajes reales que envía el bot, en una pantalla de ejemplo.</div>
  <div class="telefono">
    <header><div class="avatar">MIA</div><div><b>Asistente de los posgrados</b><small>Número de pruebas (sandbox)</small></div></header>
    <div id="mensajes"><div class="escribiendo" id="escribiendo" hidden>escribiendo...</div></div>
    <form class="caja" id="caja" autocomplete="off">
      <input id="entrada" aria-label="Mensaje" placeholder="Escribe un mensaje">
      <button type="button" class="audio" id="audio" aria-label="Enviar un audio">Audio</button>
      <button type="submit" id="enviar">Enviar</button>
    </form>
  </div>
  <div class="lado"></div>
<script>
  let minuto = 42;
  const lista = document.getElementById('mensajes');
  const indicador = document.getElementById('escribiendo');
  const esc = (t) => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  // Formato de WhatsApp: *negrita*, _cursiva_ y listas con guion.
  const formato = (t) => esc(t).replace(/^- /gm, '• ').replace(/\*([^*\n]+)\*/g, '<b>$1</b>').replace(/(^|\s)_([^_\n]+)_(?=\s|$)/g, '$1<i>$2</i>');
  const hora = () => `10:${String(minuto++ % 60).padStart(2, '0')}`;
  function poner(clase, html) {
    const el = document.createElement('div');
    el.className = 'b ' + clase;
    el.innerHTML = html + `<span class="hora">${hora()}</span>`;
    lista.insertBefore(el, indicador);
    lista.scrollTop = lista.scrollHeight;
    return el;
  }
  window.escena = {
    usuario: (t) => poner('yo', esc(t)),
    bot: (t) => poner('bot', formato(t)),
    imagen: (src, pie) => poner('bot', `<img src="${src}" alt="${esc(pie)}">${esc(pie)}`),
    nota: (t) => { const e = document.createElement('div'); e.className = 'nota'; e.textContent = t; lista.insertBefore(e, indicador); lista.scrollTop = lista.scrollHeight; },
    escribiendo: (v) => { indicador.hidden = !v; lista.scrollTop = lista.scrollHeight; },
  };
  document.getElementById('caja').addEventListener('submit', (e) => {
    e.preventDefault();
    const campo = document.getElementById('entrada');
    if (campo.value.trim()) { window.escena.usuario(campo.value.trim()); campo.value = ''; }
  });
  document.getElementById('audio').addEventListener('click', () => window.escena.usuario('Mensaje de voz (0:04)'));
</script>
</body>
</html>
